name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --locked

      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          & $wix extension add -g WixToolset.UI.wixext/5.0.2
          & $wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Package MSI + portable bundle
        shell: pwsh
        run: ./tools/build_msi.ps1 -SkipBuild

      - name: Report sizes
        shell: pwsh
        run: |
          Get-ChildItem dist/AllStore-* |
            ForEach-Object { "$($_.Name) = $([math]::Round($_.Length / 1KB, 1)) KB" } |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allstore-windows-x64
          path: |
            dist/AllStore-*.msi
            dist/AllStore-*.zip
            dist/AllStore-*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AllStore-*.msi
            dist/AllStore-*.zip
            dist/AllStore-*.exe
          generate_release_notes: true
